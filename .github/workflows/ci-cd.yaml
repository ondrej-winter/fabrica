name: CI/CD

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@e105c8fb1d7b13074b851babdaef4185243c6a07
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Test
        run: uv run --frozen --all-groups pytest

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Import lint
        run: uv run lint-imports

      - name: Test
        run: uv run pytest

      - name: Build distribution packages
        run: uv build

      - name: Smoke test local console package
        run: uvx --from . fabrica --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  patch-release:
    name: Create patch release and publish to PyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fabrica/
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release version --patch --no-changelog

      - name: Publish distribution packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
