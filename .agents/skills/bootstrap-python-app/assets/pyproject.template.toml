[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "<app_name>"
version = "0.1.0"
requires-python = ">=<python_version>"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.hatch.build.targets.wheel]
packages = ["src/<app_name>"]

[tool.ruff]
line-length = 120
target-version = "py<python_version_nodot>" # e.g. py313 (version without the dot)
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing comma — conflicts with ruff formatter
    "ISC001",  # implicit string concat — conflicts with ruff formatter
    "D203",    # one-blank-line-before-class — incompatible with D211
    "D213",    # multi-line-summary-second-line — incompatible with D212
    "D1",      # missing docstrings — too noisy for early development
    "ANN",     # type annotations — covered by ty for this scaffold
    "CPY001",  # copyright headers are not used by default
    "TD",      # TODO comment format
    "FIX",     # fixme comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # pytest-native assertions are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
