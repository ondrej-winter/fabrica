[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "fabrica"
version = "0.0.16"
description = "Local Python runtime for subscription-backed agent experiments."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Ondřej Winter" }]
keywords = [
    "agent-runtime",
    "agent-skills",
    "codex",
    "hexagonal-architecture",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic-ai-slim>=2.25.0,<3",
]

[project.urls]
Documentation = "https://github.com/ondrej-winter/fabrica#readme"
Repository = "https://github.com/ondrej-winter/fabrica"

[project.scripts]
fabrica = "fabrica.bootstrap.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "python-semantic-release>=10.5.2",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
build_command = "uv build"
dist_path = "dist/"
upload_to_pypi = false
upload_to_release = false

[tool.hatch.build.targets.wheel]
packages = ["src/fabrica"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing comma: conflicts with ruff formatter
    "ISC001",  # implicit string concat: conflicts with ruff formatter
    "D203",    # one-blank-line-before-class: incompatible with D211
    "D213",    # multi-line-summary-second-line: incompatible with D212
    "D1",      # missing docstrings: too noisy for early development
    "ANN",     # type annotations: covered by ty for this project
    "CPY001",  # copyright headers are not used by this project
    "TD",      # TODO comment format
    "FIX",     # fixme comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # pytest-native assertions are expected in tests

[tool.ty.src]
exclude = [".agents/**"]

[tool.importlinter]
root_package = "fabrica"

[[tool.importlinter.contracts]]
id = "features-do-not-import-product-cli-or-bootstrap"
name = "Feature slices must not import product CLI or bootstrap"
type = "forbidden"
source_modules = ["fabrica.features"]
forbidden_modules = [
    "fabrica.adapters.inbound.cli",
    "fabrica.bootstrap",
]

[[tool.importlinter.contracts]]
id = "feature-slices-follow-hexagonal-layers"
name = "Feature slices follow adapters -> application -> domain dependency direction"
type = "layers"
containers = ["fabrica.features.*"]
layers = [
    "(adapters)",
    "application",
    "(domain)",
]

[[tool.importlinter.contracts]]
id = "feature-slice-dependencies-are-acyclic"
name = "Feature slice dependencies must remain acyclic"
type = "acyclic_siblings"
ancestors = ["fabrica.features"]
depth = 0

[[tool.importlinter.contracts]]
id = "shared-kernel-stays-pure"
name = "Shared kernel must not import feature, adapter, or bootstrap code"
type = "forbidden"
source_modules = ["fabrica.shared_kernel"]
forbidden_modules = [
    "fabrica.adapters",
    "fabrica.bootstrap",
    "fabrica.features",
]

[[tool.importlinter.contracts]]
id = "feature-adapters-do-not-import-cross-slice-adapters"
name = "Feature adapters must not import adapters from other slices"
type = "forbidden"
source_modules = ["fabrica.features.*.adapters"]
forbidden_modules = ["fabrica.features.*.adapters"]
ignore_imports = [
    "fabrica.features.agent_runtime.adapters.** -> fabrica.features.agent_runtime.adapters.**",
    "fabrica.features.codex_transport.adapters.** -> fabrica.features.codex_transport.adapters.**",
    "fabrica.features.developer_workflow.adapters.** -> fabrica.features.developer_workflow.adapters.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "generic-cli-shell-stays-feature-agnostic"
name = "Generic product CLI shell modules must not import features or bootstrap"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "fabrica.adapters.inbound.cli.contributions",
    "fabrica.adapters.inbound.cli.options",
    "fabrica.adapters.inbound.cli.output",
    "fabrica.adapters.inbound.cli.parser",
    "fabrica.adapters.inbound.cli.runner",
]
forbidden_modules = [
    "fabrica.features",
    "fabrica.bootstrap",
]

[[tool.importlinter.contracts]]
id = "developer-workflow-core-does-not-import-agent-runtime"
name = "Developer workflow core must not import agent-runtime contracts"
type = "forbidden"
source_modules = ["fabrica.features.developer_workflow.application"]
forbidden_modules = ["fabrica.features.agent_runtime"]

[[tool.importlinter.contracts]]
id = "developer-workflow-inbound-cli-does-not-import-agent-runtime"
name = "Developer workflow inbound CLI must not expose agent-runtime contracts"
type = "forbidden"
source_modules = ["fabrica.features.developer_workflow.adapters.inbound"]
forbidden_modules = ["fabrica.features.agent_runtime"]

[[tool.importlinter.contracts]]
id = "developer-workflow-application-uses-query-execution-port-only"
name = "Developer workflow application may depend on query-execution ports, not implementations"
type = "forbidden"
source_modules = ["fabrica.features.developer_workflow.application"]
forbidden_modules = [
    "fabrica.features.query_execution.adapters",
    "fabrica.features.query_execution.application.use_cases",
]

[[tool.importlinter.contracts]]
id = "skill-script-subprocess-receives-metadata-loader-through-port"
name = "Skill script subprocess adapter must receive metadata loading through the application port"
type = "forbidden"
source_modules = ["fabrica.features.agent_runtime.adapters.outbound.skill_script_subprocess"]
forbidden_modules = ["fabrica.features.agent_runtime.adapters.outbound.skill_script_file"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-n=auto",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "live_codex: opt-in tests that read local Codex credentials and call the live Codex backend",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 93
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
